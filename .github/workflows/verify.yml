name: Verify pull requests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify GitHub Pages build without production credentials
        env:
          VITE_BASE_PATH: /Kogakure/
          VITE_OFFLINE_PREVIEW: 'true'
        run: npm run build
      - name: Verify house rules content and chapter links (no database access)
        run: node scripts/qa-house-rules.mjs
      - name: Verify tea menu content, pricing and preview rendering
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-menu.mjs
      - name: Verify accounting ledger, owner permissions and daily order navigation
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-accounting.mjs
      - name: Verify guest tea-order submission, secured manager workflow and pending order notifications
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-tea-orders.mjs
      - name: Verify tea menu and booking first-paint readiness, query deduplication and safe submits
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-menu-booking-load-performance.mjs
      - name: Verify real first-visit menu and booking while published data is delayed
        run: node scripts/qa-menu-booking-cold-visit.mjs
      - name: Verify first shift visit paints all dates before slow Supabase responses
        run: node scripts/qa-shift-cold-first-paint.mjs
      - name: Verify public shifts load without repeated queries or long row animations
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-shift-load-performance.mjs
      - name: Verify rolling four-week opening dates and employee duty roster
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-shift-roster.mjs
      - name: Verify cached service navigation and offscreen image efficiency
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-service-load-performance.mjs
      - name: Verify each service photo crop selection and saved front-end framing
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-service-photo-crop.mjs
      - name: Verify Chinese service titles avoid lone-character line breaks on phones
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-service-title-wrap.mjs
      - name: Verify editable services, polaroid keepsake, guarded admin CRUD and storage policy
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-service-content.mjs
      - name: Verify Discord social links and mobile navigation
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-discord-social-entry.mjs
      - name: Verify shared public background music and mobile playback controls
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-site-bgm.mjs
      - name: Verify first-load logo image decoding and sequential entrance fade in Chromium
        run: node scripts/qa-entry-intro-first-load.mjs
      - name: Verify services and shifts reveal shared rotating venue photography
        run: node scripts/qa-public-scene-backdrops.mjs
      - name: Verify public page fade pacing and curtain handling
        run: node scripts/qa-public-page-fades.mjs
      - name: Verify first-load tea menu does not flash between loaders
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-menu-first-load.mjs
      - name: Verify implementation comments never render as page text
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-jsx-comment-leak.mjs
      - name: Verify public booking workflow and private database permissions
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-bookings.mjs
      - name: Verify manual staff photo selection and uncropped full-size images
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-staff-crop.mjs
      - name: Verify booking cards visibility and admin create/delete workflow
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-booking-admin-crud.mjs
      - name: Verify responsive booking cards and role-agnostic nominations
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-booking-role-layout.mjs
      - name: Verify full-bleed booking portraits and details-only inner frame
        run: node scripts/qa-booking-card-presentation.mjs
      - name: Verify booking entrance matches staff directory pacing
        run: node scripts/qa-booking-fade.mjs
      - name: Verify no-staff booking page fills viewport and fades in with other pages
        run: node scripts/qa-booking-empty-state.mjs
      - name: Verify sidebar pending-booking count and incoming alerts
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-admin-booking-sidebar.mjs
      - name: Verify every additional nominee appears in booking confirmations and admin inbox
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-booking-extra-nominees.mjs
      - name: Verify manager-created employee accounts, password resets, deletion and scoped roles
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-employee-permissions.mjs
      - name: Verify staff can securely change their own password
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-employee-self-password.mjs
