name: Verify pull requests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify GitHub Pages build without production credentials
        env:
          VITE_BASE_PATH: /Kogakure/
          VITE_OFFLINE_PREVIEW: 'true'
        run: npm run build
      - name: Verify house rules content and chapter links (no database access)
        run: node scripts/qa-house-rules.mjs
      - name: Verify tea menu content, pricing and read-only rendering
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-menu.mjs
      - name: Verify public page fade pacing and curtain handling
        run: node scripts/qa-public-page-fades.mjs
      - name: Verify first-load tea menu does not flash between loaders
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-menu-first-load.mjs
      - name: Verify implementation comments never render as page text
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-jsx-comment-leak.mjs
      - name: Verify public booking workflow and private database permissions
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-bookings.mjs
      - name: Verify manual staff photo selection and uncropped full-size images
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-staff-crop.mjs
      - name: Verify booking cards visibility and admin create/delete workflow
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-booking-admin-crud.mjs
      - name: Verify responsive booking cards and role-agnostic nominations
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-booking-role-layout.mjs
      - name: Verify full-bleed booking portraits and details-only inner frame
        run: node scripts/qa-booking-card-presentation.mjs
      - name: Verify booking entrance matches staff directory pacing
        run: node scripts/qa-booking-fade.mjs
      - name: Verify no-staff booking page fills viewport and fades in with other pages
        run: node scripts/qa-booking-empty-state.mjs
      - name: Verify sidebar pending-booking count and incoming alerts
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-admin-booking-sidebar.mjs
      - name: Verify every additional nominee appears in booking confirmations and admin inbox
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-booking-extra-nominees.mjs
      - name: Verify manager-created employee accounts, password resets, deletion and scoped roles
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-employee-permissions.mjs
