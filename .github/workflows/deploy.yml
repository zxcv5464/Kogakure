name: Publish Kogakure website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify public Supabase configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Set repository Actions variables VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY before publishing."
            exit 1
          fi
          if [[ "$VITE_SUPABASE_PUBLISHABLE_KEY" != sb_publishable_* ]]; then
            echo "::error::Use only the Supabase publishable key, never a secret/service_role key."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Verify private keepsake delivery, expiry cleanup and moderated guestbook
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-guest-memories.mjs
      - name: Build for GitHub Pages
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE_PATH: /Kogakure/
        run: npm run build
      - name: Verify Discord and Threads entries across desktop mobile and footer
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-discord-social-entry.mjs
      - name: Verify website BGM controls and autoplay fallback
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-site-bgm.mjs
      - name: Verify live BGM management, upload library, delegated permissions and YouTube playback
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-bgm-management.mjs
      - name: Verify cold first-visit logo fade and enter-button animation in Chromium
        run: node scripts/qa-entry-intro-first-load.mjs
      - name: Verify shared rotating scene backgrounds on services and shifts
        run: node scripts/qa-public-scene-backdrops.mjs
      - name: Verify completed-order turnover and equal staff salary ledger
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-daily-payroll.mjs
      - name: Verify homepage announcements, owner-only publication and admin news editor
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-announcements.mjs
      - name: Verify all scroll surfaces use unobtrusive directional hints
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-scroll-cues.mjs
      - name: Verify all delegable backoffice permissions and privilege-escalation guards
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-complete-admin-permissions.mjs
      - name: Verify owner accounting ledger, date-scoped tea orders and CSV safety
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: |
          node scripts/qa-accounting.mjs
          node scripts/qa-employee-permissions.mjs
          node scripts/qa-tea-orders.mjs
          node scripts/qa-tc-world-dropdown.mjs
      - name: Verify tea menu and booking public caches, safe first-paint UI and existing submission flows
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: |
          node scripts/qa-menu-booking-load-performance.mjs
          node scripts/qa-menu-first-load.mjs
          node scripts/qa-booking-fade.mjs
          node scripts/qa-booking-empty-state.mjs
      - name: Verify cold first-visit tea and booking pages during slow database reads in Chromium
        run: node scripts/qa-menu-booking-cold-visit.mjs
      - name: Verify cold first-visit shifts stay responsive during delayed database reads
        run: node scripts/qa-shift-cold-first-paint.mjs
      - name: Verify smooth public shifts loading, cache and refresh behaviour
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-shift-load-performance.mjs
      - name: Verify rolling four-week opening dates and employee duty roster
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-shift-roster.mjs
      - name: Verify independent booking photo upload and delete before publication
        run: node scripts/qa-booking-photos.mjs
      - name: Verify profile and booking galleries, mysterious reveal, dots, crops and floating sticker
        run: node scripts/qa-photo-galleries.mjs
      - name: Verify nomination visibility moved to booking management with scoped permissions
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: |
          node scripts/qa-booking-admin-crud.mjs
          node scripts/qa-booking-staff-rules.mjs
          node scripts/qa-booking-role-layout.mjs
          node scripts/qa-booking-quotas.mjs
      - name: Verify services page fast loading and bounded photo gallery
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-service-load-performance.mjs
      - name: Verify interactive photo crop editor, display framing and backwards-compatible schema
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-service-photo-crop.mjs
      - name: Verify Chinese service titles avoid lone-character line breaks on phones
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-service-title-wrap.mjs
      - name: Verify service content and admin editor before publication
        env:
          VITE_OFFLINE_PREVIEW: 'true'
        run: node scripts/qa-service-content.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
      - name: Confirm Pages artifact is visible before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')"
            if [ "${count}" -gt 0 ]; then
              echo "Found ${count} GitHub Pages artifact(s)."
              exit 0
            fi
            echo "Pages artifact is not visible yet (${attempt}/12); waiting 5 seconds..."
            sleep 5
          done
          echo "::error::The uploaded GitHub Pages artifact did not become visible to the deployment API."
          exit 1
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
