# Security update PRs are managed separately from routine version-update PRs.
# Avoid flooding the owner with unreviewed major-version upgrade requests.
# Keep Dependabot alerts and security updates enabled in repository Settings.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
